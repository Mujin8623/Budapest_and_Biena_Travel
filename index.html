<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f7">
  <meta name="description" content="2026년 11월 27일–12월 6일 비엔나, 부다페스트 개인 여행 일정">
  <title>비엔나 · 부다페스트</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">2026.11.27 – 12.06</p>
        <h1>비엔나 · 부다페스트</h1>
      </div>
      <button type="button" class="icon-btn" id="snow-btn" data-action="snow" aria-pressed="false">눈</button>
    </header>
    <main id="main">
      <section id="view-home" class="view"></section>
      <section id="view-schedule" class="view" hidden></section>
      <section id="view-map" class="view view-map" hidden>
        <div id="map" role="application" aria-label="여행 지도"></div>
        <div id="map-skeleton" class="map-skeleton">지도를 준비하고 있습니다</div>
        <div class="map-top">
          <div id="map-mode"></div>
          <div id="map-chips" class="chips"></div>
        </div>
        <div id="map-card" class="map-card"></div>
        <p id="map-status" class="map-status" hidden></p>
      </section>
      <section id="view-info" class="view" hidden></section>
      <section id="view-docs" class="view" hidden></section>
    </main>
  </div>
  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z"></path></svg>
      <span>홈</span>
    </a>
    <a href="#/schedule" data-tab="schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3.5V7M16 3.5V7M4 10h16"></path></svg>
      <span>일정</span>
    </a>
    <a href="#/map" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10Z"></path><circle cx="12" cy="11" r="1.6" fill="currentColor" stroke="none"></circle></svg>
      <span>지도</span>
    </a>
    <a href="#/docs" data-tab="docs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"></path><path d="M14 3.5V9h5"></path></svg>
      <span>문서함</span>
    </a>
    <a href="#/info" data-tab="info">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      <span>정보</span>
    </a>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle"></div>
      <button type="button" class="sheet-close" data-action="close-sheet">닫기</button>
      <div id="sheet-photo-slot"></div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>
  <canvas id="snow" aria-hidden="true"></canvas>
  <noscript>일정을 보려면 자바스크립트가 필요합니다. 데이터는 이 페이지 안의 스크립트로 들어 있습니다.</noscript>
  <script src="data/trip.js"></script>
  <script src="data/transit.js"></script>
  <script src="data/guide.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
